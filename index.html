<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Puzzle</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.jpg">
</head>
<body>
    <div class="container">
        <header>
            <h1>8 Puzzle</h1>
        </header>
        <main>
            <div class="game-container">
                <div class="game-board" id="game-board"></div>
                <div class="controls">
                    <button id="shuffle-btn">Shuffle</button>
                    <button id="solve-btn">Solve</button>
                </div>
                <div class="game-info">
                    <p>Moves: <span id="moves">0</span></p>
                    <p>Time: <span id="time">0s</span></p>
                </div>
            </div>
            <div class="image-selection">
                <h2>Select an Image</h2>
                <div class="images">
                    <img src="assets/1.jpg" alt="Puzzle Image 1" class="puzzle-img">
                    <img src="assets/2.jpg" alt="Puzzle Image 2" class="puzzle-img">
                    <img src="assets/3.jpg" alt="Puzzle Image 3" class="puzzle-img">
                </div>
.
                <div class="upload-container">
                    <input type="file" id="upload-img" accept="image/*">
                    <label for="upload-img">Upload Image</label>
                </div>
            </div>
            <div class="difficulty-selection">
                <h2>Difficulty</h2>
                <select id="difficulty">
                    <option value="3">Easy (3x3)</option>
                    <option value="4">Medium (4x4)</option>
                    <option value="5">Hard (5x5)</option>
                </select>
            </div>
            <div class="high-scores">
                <h2>High Scores</h2>
                <ul id="high-scores-list"></ul>
            </div>
        </main>
        <footer>
            <p>Created by Dowran Rowshenow - Improved by Jules</p>
        </footer>
    </div>
    <script src="js/main.js" type="module"></script>
</body>
</html>
